name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Project tests
        run: |
          set -e
          for p in projects/*/; do
            echo "== $p"
            python3 -m unittest discover -s "$p/tests" -t . -p 'test_*.py' -v
          done
      - name: Example replays
        run: |
          set -e
          for slug in $(python3 -m enterprise_ai list | awk '{print $1}'); do
            python3 -m enterprise_ai run "$slug" > /dev/null
            echo "replay ok: $slug"
          done
      - name: Baseline evals
        run: |
          set -e
          for slug in $(python3 -m enterprise_ai list | awk '{print $1}'); do
            python3 -m enterprise_ai eval "$slug" --baseline-only --out "/tmp/base-$slug" > /dev/null
            echo "baseline ok: $slug"
          done
      - name: Generators are deterministic
        run: |
          set -e
          for p in projects/*/; do
            cp "$p/evals/cases.jsonl" /tmp/before.jsonl
            python3 "$p/evals/generate_cases.py" > /dev/null
            cmp /tmp/before.jsonl "$p/evals/cases.jsonl"
          done
